name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/react-native-music-player-6ws2sd
      - main

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias JS
        run: npm ci

      - name: Compilar APK release
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Preparar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MusicaUSB.apk
          sha256sum MusicaUSB.apk > MusicaUSB.apk.sha256

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MusicaUSB-apk
          path: |
            MusicaUSB.apk
            MusicaUSB.apk.sha256
          retention-days: 14

      - name: Publicar APK en la rama apk-dist
        run: |
          mkdir -p /tmp/apk-dist && cd /tmp/apk-dist
          git init -b apk-dist
          cp "$GITHUB_WORKSPACE/MusicaUSB.apk" "$GITHUB_WORKSPACE/MusicaUSB.apk.sha256" .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "APK build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
